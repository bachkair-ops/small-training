const questions = [
  {
    topic: 'Личная гигиена',
    text: 'Сотрудник приступает к приготовлению салатов. Что необходимо сделать перед началом работы?',
    answers: ['Надеть перчатки без мытья рук', 'Вымыть и высушить руки, надеть чистую санитарную одежду и убрать волосы', 'Протереть руки сухой салфеткой', 'Проверить внешний вид только в конце смены'],
    correct: 1,
    explanation: 'Перед работой с пищевой продукцией необходимо соблюдать правила личной гигиены: вымыть и высушить руки, надеть чистую санитарную одежду и головной убор. Перчатки не заменяют мытьё рук.'
  },
  {
    topic: 'Перекрёстное загрязнение',
    text: 'После разделки сырой курицы нужно нарезать готовый к употреблению продукт. Как действовать?',
    answers: ['Использовать ту же доску, если на ней нет видимых загрязнений', 'Протереть нож сухой салфеткой', 'Вымыть руки и использовать отдельный чистый инвентарь для готовой продукции', 'Сначала нарезать готовый продукт, затем вымыть всё вместе'],
    correct: 2,
    explanation: 'Сырое мясо и готовая к употреблению продукция должны обрабатываться раздельно. Используйте предусмотренный для готовой продукции чистый инвентарь и соблюдайте процедуру мытья рук и смены перчаток.'
  },
  {
    topic: 'Приёмка и хранение',
    text: 'При приёмке сырья обнаружена упаковка с истёкшим сроком годности. Что делать?',
    answers: ['Не допускать сырьё в производство, изолировать и сообщить ответственному', 'Использовать немедленно, если запах нормальный', 'Изменить дату на этикетке', 'Добавить сырьё в продукцию, которая пройдёт нагрев'],
    correct: 0,
    explanation: 'Сырьё с истёкшим сроком годности не допускают к использованию. Его изолируют от пригодных продуктов, фиксируют несоответствие и действуют по установленной процедуре. Нагрев не делает такое сырьё допустимым.'
  },
  {
    topic: 'Аллергены',
    text: 'После изготовления изделий с орехами запланирована продукция без орехов в составе. Что важно сделать?',
    answers: ['Только убрать видимые кусочки орехов', 'Использовать тот же инвентарь без очистки', 'Считать, что выпекание удалит аллергены', 'Выполнить предусмотренную процедуру очистки и предотвращения переноса аллергенов'],
    correct: 3,
    explanation: 'Даже небольшое количество аллергена может быть опасно. Соблюдайте утверждённые процедуры разделения, очистки, смены инвентаря и контроля. Обычная тепловая обработка не гарантирует устранение аллергенов.'
  },
  {
    topic: 'Маркировка продукции',
    text: 'Полуфабрикат переложили из заводской упаковки в производственную ёмкость. Как поступить с маркировкой?',

    explanation: 'Внутренняя маркировка должна позволять определить продукт, его партию, применимые даты, срок и условия хранения по регламенту предприятия. Перекладывание в другую ёмкость не продлевает срок годности.'
  },
  {
    topic: 'Температурный контроль',
    text: 'Температура в холодильнике с готовой продукцией вышла за установленные пределы. Что делать?',
    answers: ['Оценить безопасность только по запаху', 'Продолжить реализацию всей продукции', 'Зафиксировать отклонение, сообщить ответственному и действовать по процедуре оценки продукции', 'Просто изменить запись в журнале'],
    correct: 2,
    explanation: 'Отклонение нужно зафиксировать и передать ответственному. Продукцию оценивают по установленной процедуре с учётом времени и температуры. Запах и внешний вид не доказывают микробиологическую безопасность.'
  },

function resultRow(r){return `<button class="result-row" data-action="open-result" data-id="${escape(r.id)}"><span class="result-row-icon">${icon('clipboard')}</span><span class="result-row-title"><strong>${COURSE_TITLE}</strong><small>${date(r.date)} · ${duration(r.duration)}</small></span><span class="result-row-score">${r.score}/${questions.length}<small>${r.percent}%</small></span><span class="status-pill ${r.percent>=PASS_PERCENT?'success':'retry'}">${r.percent>=PASS_PERCENT?'Пройдено':'Повторить'}</span>${icon('chevron')}</button>`;}
function resultsPage(){return `<div class="page-heading"><div><div class="eyebrow">ВАШ ПРОГРЕСС</div><h1>Мои результаты</h1><p>Каждая попытка помогает двигаться вперёд.</p></div></div>${history.length?`<div class="results-summary"><span>${icon('clipboard')} Попыток: <strong>${history.length}</strong></span><span>${icon('award')} Лучший результат: <strong>${Math.max(...history.map(r=>r.percent))}%</strong></span></div><section class="results-list">${history.map(resultRow).join('')}</section><p class="demo-note">История хранится только в этом браузере. Очистка данных браузера удалит результаты.</p>`:`<section class="empty-state"><span>${icon('chart')}</span><h2>Ваш первый результат впереди</h2><p>Пройдите проверку, чтобы увидеть свои баллы<br>и разобраться в сложных вопросах.</p><button class="button button-primary" data-action="start">Начать проверку ${icon('arrow')}</button></section>`}`;}
function materials(){const items=[['Гигиена и здоровье сотрудника','Перед работой с пищевой продукцией вымойте и высушите руки, наденьте чистую санитарную одежду и уберите волосы. Перчатки не заменяют мытьё рук. При рвоте или диарее сообщите руководителю и не приступайте к работе с продуктами.'],['Разделение продуктов и аллергены','Используйте раздельный чистый инвентарь для сырья и готовой продукции. Перед переходом от изделий с аллергенами к другим выполните утверждённую процедуру очистки и предотвращения переноса аллергенов. Нагрев не гарантирует их устранение.'],['Приёмка, хранение и маркировка','Не допускайте просроченное сырьё в производство. Сохраняйте маркировку и прослеживаемость, используйте в первую очередь пригодные партии с более ранним сроком годности (FEFO). При температурных отклонениях зафиксируйте их и сообщите ответственному.'],['Мойка и качество продукции','Удаляйте загрязнения, выполняйте мойку и дезинфекцию по инструкции: соблюдайте концентрацию, время воздействия и правила смывания. Не смешивайте средства. Условия хранения и срок годности, в том числе изделий с кремом, берите из утверждённой документации на конкретный продукт.']];return `<div class="page-heading"><div><div class="eyebrow">БАЗА ЗНАНИЙ</div><h1>Материалы для подготовки</h1><p>Готовая еда, напитки, кондитерские изделия и пекарня: коротко о главном.</p></div></div><div class="materials-grid">${items.map(([title,body],i)=>`<article class="material-card"><span class="material-number">0${i+1}</span>${icon('book')}<h2>${title}</h2><p>${body}</p></article>`).join('')}</div><div class="material-cta"><div><h2>Готовы проверить себя?</h2><p>10 вопросов помогут закрепить материал.</p></div><button class="button button-primary" data-action="start">Начать проверку ${icon('arrow')}</button></div><div class="demo-note">Материалы предназначены для подготовки. Для официальной аттестации согласуйте вопросы с ответственным за пищевую безопасность.</div>`;}
function modalHtml(){const finish=modal==='finish';return `<div class="modal-overlay"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><button class="modal-close icon-button" data-action="close-modal" aria-label="Закрыть">${icon('close')}</button><span class="modal-icon">${icon(finish?'clipboard':'help')}</span><h2 id="modal-title">${finish?'Завершить проверку?':modal==='retry'?'Начать новую попытку?':'Как устроена проверка'}</h2><p>${finish?`Вы ответили на ${answered()} из ${questions.length} вопросов. ${answered()<questions.length?'Вопросы без ответа принесут 0 баллов.':''} После завершения вы увидите результат и разбор.`:modal==='retry'?'Текущая незавершённая попытка будет заменена новой. Сохранённые результаты останутся в истории.':'В каждом вопросе один верный ответ и один балл. Чтобы пройти проверку, нужно набрать не менее '+PASS_PERCENT+'%. Число попыток не ограничено. Ответы и результаты хранятся только в вашем браузере.'}</p>${!finish&&modal!=='retry'?'<div class="help-note">Это учебная самопроверка. По вопросам регламентов и официальной аттестации обратитесь к ответственному за пищевую безопасность в вашей организации.</div>':''}<div class="modal-actions"><button class="button button-outline" data-action="close-modal">${finish?'Вернуться к вопросам':modal==='retry'?'Отмена':'Понятно'}</button>${finish?'<button class="button button-primary" data-action="confirm-finish">Узнать результат '+icon('arrow')+'</button>':modal==='retry'?'<button class="button button-primary" data-action="confirm-retry">Начать заново</button>':''}</div></section></div>`;}
function start(fresh=false){if(!session||fresh){session={id:crypto.randomUUID(),answers:questions.map(()=>null),index:0,started:Date.now()};write('sp-session-v2',session);}view='quiz';modal=null;render();window.scrollTo(0,0);}
function finish(){const score=session.answers.reduce((n,a,i)=>n+(a===questions[i].correct?1:0),0);result={id:session.id,answers:[...session.answers],score,percent:Math.round(score/questions.length*100),date:new Date().toISOString(),duration:Math.max(0,Math.floor((Date.now()-session.started)/1000))};history=[result,...history.filter(r=>r.id!==result.id)].slice(0,100);write('sp-results-v2',history);session=null;write('sp-session-v2',null);modal=null;view='result';render();window.scrollTo(0,0);}
app.addEventListener('change',e=>{if(e.target.name==='answer'&&session){session.answers[session.index]=Number(e.target.value);write('sp-session-v2',session);pendingFocus=`input[value="${e.target.value}"]`;render();}});
app.addEventListener('click',e=>{const button=e.target.closest('[data-action]');if(!button)return;e.preventDefault();const action=button.dataset.action;
 if(['overview','tests','results','materials'].includes(action)){view=action;mobileMenu=false;render();window.scrollTo(0,0);}
 else if(action==='start')start();
 else if(action==='menu'){mobileMenu=!mobileMenu;render();}
 else if(action==='help'||action==='finish'){modal=action;render();document.querySelector('.modal button')?.focus();}
 else if(action==='close-modal'){modal=null;render();document.querySelector(view==='quiz'?'[data-action="finish"]':'[data-action="help"]')?.focus();}
 else if(action==='confirm-finish')finish();
 else if(action==='retry'){if(session){modal='retry';render();}else start(true);}
 else if(action==='confirm-retry')start(true);
 else if(action==='next'||action==='previous'||action==='jump'){session.index=action==='jump'?Number(button.dataset.index):session.index+(action==='next'?1:-1);write('sp-session-v2',session);pendingFocus='#question-heading';render();}
 else if(action==='leave'){view='tests';render();window.scrollTo(0,0);}
 else if(action==='open-result'){result=history.find(r=>r.id===button.dataset.id);if(result){view='result';render();window.scrollTo(0,0);}}
});
document.addEventListener('keydown',e=>{if(!modal)return;if(e.key==='Escape'){modal=null;render();}if(e.key==='Tab'){const buttons=[...document.querySelectorAll('.modal button')];if(e.shiftKey&&document.activeElement===buttons[0]){e.preventDefault();buttons.at(-1).focus();}else if(!e.shiftKey&&document.activeElement===buttons.at(-1)){e.preventDefault();buttons[0].focus();}}});
setInterval(()=>{const el=document.querySelector('#elapsed');if(el&&session)el.textContent=duration(Math.max(0,Math.floor((Date.now()-session.started)/1000)));},1000);
render();</script></body></html>
